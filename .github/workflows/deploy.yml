name: Deploy to SmarterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish CarProject/CarProject/CarProject.csproj -c Release -o publish --nologo
        shell: pwsh

      - name: Prepare publish output
        shell: pwsh
        run: |
          $pub = "publish"
          # Remove Development settings (would override the production connection string)
          Remove-Item "$pub\appsettings.Development.json" -Force -ErrorAction SilentlyContinue

          # Write production web.config with stdout logging enabled
          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet" arguments=".\CarProject.dll" stdoutLogEnabled="true" stdoutLogFile=".\logs\stdout" hostingModel="inprocess" />
              </system.webServer>
            </location>
          </configuration>
          '@
          Set-Content -Path "$pub\web.config" -Value $webConfig -Encoding UTF8
          Write-Host "Prepared publish output"
          Get-ChildItem "$pub" -File | Select-Object Name, Length

      - name: Put app offline
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          $content = "<html><body>Maintenance in progress, please wait...</body></html>"
          $req = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_HOST/site1/app_offline.htm")
          $req.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $req.Credentials = New-Object System.Net.NetworkCredential($env:FTP_USER, $env:FTP_PASS)
          $req.UsePassive = $true
          $req.UseBinary = $true
          $req.Proxy = $null
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($content)
          $req.ContentLength = $bytes.Length
          $stream = $req.GetRequestStream()
          $stream.Write($bytes, 0, $bytes.Length)
          $stream.Close()
          $resp = $req.GetResponse()
          Write-Host "app_offline.htm uploaded: $($resp.StatusDescription)"
          $resp.Close()
          Start-Sleep -Seconds 5
          Write-Host "Waiting 5s for IIS to take app offline and release locks"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site1/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/Node*/**
            **/logs/**

      - name: Bring app back online
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          $req = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_HOST/site1/app_offline.htm")
          $req.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $req.Credentials = New-Object System.Net.NetworkCredential($env:FTP_USER, $env:FTP_PASS)
          $req.UsePassive = $true
          $req.Proxy = $null
          try {
            $resp = $req.GetResponse()
            Write-Host "app_offline.htm removed: $($resp.StatusDescription)"
            $resp.Close()
          } catch {
            Write-Host "Remove result: $($_.Exception.Message)"
          }**
